<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한화손해보험 김의철 팀장 | 공식 모바일 명함</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }

  body {
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }

  .mobile-card {
    width: 100%;
    max-width: 400px;
    background: #1e293b;
    border-radius: 24px;
    padding: 32px 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    border: 1px solid #334155;
    text-align: center;
  }

  /* 프로필 영역 */
  .profile-badge {
    display: inline-block;
    background: #ea580c;
    color: #ffffff;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .profile-name {
    font-size: 24px;
    font-weight: 900;
    color: #ffffff;
    margin-bottom: 4px;
  }
  .profile-role {
    font-size: 14px;
    color: #94a3b8;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .profile-desc {
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.5;
    background: #0f172a;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 24px;
    border: 1px solid #334155;
  }

  /* 링크 버튼 목록 */
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 800;
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .link-btn:active {
    transform: scale(0.98);
  }

  /* 각 버튼별 테마 컬러 */
  .btn-tel { background: #ea580c; color: #ffffff; }
  .btn-kakao { background: #fee500; color: #191919; }
  .btn-blog { background: #03c75a; color: #ffffff; }
  .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #ffffff; }
  .btn-form { background: #38bdf8; color: #0f172a; }

  .btn-icon {
    font-size: 18px;
    margin-right: 8px;
  }
  .btn-title {
    display: flex;
    align-items: center;
  }
  .btn-arrow {
    font-size: 14px;
    opacity: 0.7;
  }

  /* 하단 푸터 */
  .footer {
    margin-top: 24px;
    font-size: 11px;
    color: #64748b;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="mobile-card">
  
  <!-- 프로필 -->
  <div class="profile-badge">한화손해보험 충북지역단</div>
  <h1 class="profile-name">김의철 팀장</h1>
  <div class="profile-role"> CRM·CS 전문 강사 | 25년 보장분석 전문가</div>
  
  <div class="profile-desc">
    "사업장 과태료 방지부터 누수·시설 배상, 숨은 보험금 케어까지 꼼꼼하게 해결해 드립니다."
  </div>

  <!-- 링크 버튼 리스트 -->
  <div class="btn-group">
    
    <!-- 1. 전화 연결 -->
    <a href="tel:01057886531" class="link-btn btn-tel">
      <div class="btn-title"><span class="btn-icon">📞</span> 1초 즉시 전화 상담 연결</div>
      <span class="btn-arrow">➔</span>
    </a>

    <!-- 2. 구글 폼 과태료 진단 -->
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfH2RASsftwSF0xGV0z0lhKL0iGF36bcHIwOLD3ZirNNvrksw/viewform" target="_blank" class="link-btn btn-form">
      <div class="btn-title"><span class="btn-icon">📋</span> 사업장 과태료 & 위험 1분 점검</div>
      <span class="btn-arrow">➔</span>
    </a>

    <!-- 3. 오픈 카카오톡 -->
    <a href="https://open.kakao.com" target="_blank" class="link-btn btn-kakao">
      <div class="btn-title"><span class="btn-icon">💬</span> 카카오톡 1:1 비밀 상담</div>
      <span class="btn-arrow">➔</span>
    </a>

    <!-- 4. 네이버 블로그 -->
    <a href="https://blog.naver.com" target="_blank" class="link-btn btn-blog">
      <div class="btn-title"><span class="btn-icon">📝</span> 네이버 공식 블로그 바로가기</div>
      <span class="btn-arrow">➔</span>
    </a>

    <!-- 5. 인스타그램 -->
    <a href="https://instagram.com" target="_blank" class="link-btn btn-insta">
      <div class="btn-title"><span class="btn-icon">📸</span> 공식 인스타그램 구경하기</div>
      <span class="btn-arrow">➔</span>
    </a>

  </div>

  <!-- 푸터 -->
  <div class="footer">
    © 한화손해보험 김의철 팀장. All Rights Reserved.
  </div>

</div>

</body>
</html>

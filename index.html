<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한화손해보험 김의철 팀장 | 공식 모바일 명함</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }
    .card-container {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 28px;
      padding: 36px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #ea580c;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
      letter-spacing: -0.3px;
    }
    .name-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .sub-title {
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .quote-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px 14px;
      font-size: 13.5px;
      line-height: 1.5;
      color: #e2e8f0;
      margin-bottom: 24px;
      word-break: keep-all;
    }
    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.15s ease, filter 0.15s ease;
      color: #ffffff;
    }
    .btn-item:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }
    .btn-item .left-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-item .arrow {
      font-size: 14px;
      opacity: 0.9;
    }
    
    /* 각 버튼별 시그니처 컬러 */
    .btn-call { background: #f97316; }        /* 전화: 오렌지 */
    .btn-personal { background: #0284c7; }    /* 인보장 설문: 스카이블루 */
    .btn-business { background: #0ea5e9; }    /* 사업장 설문: 블루 */
    .btn-kakao { background: #eab308; color: #1e293b; } /* 카톡: 옐로우 */
    .btn-blog { background: #10b981; }        /* 블로그: 그린 */
    .btn-insta { background: #ec4899; }       /* 인스타: 마젠타/핑크 */

    .footer {
      margin-top: 28px;
      font-size: 11.5px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- 소속 배지 -->
    <div class="badge">한화손해보험 충북지역단</div>

    <!-- 이름 및 직함 -->
    <h1 class="name-title">김의철 팀장</h1>
    <div class="sub-title">CRM·CS 전문 강사 | 25년 보장분석 전문가</div>

    <!-- 슬로건 -->
    <div class="quote-box">
      "사업장 과태료 방지부터 누수·시설 배상, 숨은 보험금 케어까지 꼼꼼하게 해결해 드립니다."
    </div>

    <!-- 버튼 링크 영역 -->
    <div class="btn-list">
      <!-- 1. 전화 연결 -->
      <a href="tel:01057886531" class="btn-item btn-call">
        <div class="left-group">
          <span>📞</span>
          <span>1초 즉시 전화 상담 연결</span>
        </div>
        <span class="arrow">➔</span>
      </a>

      <!-- 2. 인보장 보험 문의 (구글 설문 폼) -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfyhvao90vrKj-qTZHrENRr6xyPlMrbnoRCtrObl2LL6i7jzQ/viewform" target="_blank" class="btn-item btn-personal">
        <div class="left-group">
          <span>🩺</span>
          <span>내 보험 숨은 돈 & 보장 1분 점검</span>
        </div>
        <span class="arrow">➔</span>
      </a>

      <!-- 3. 사업장 과태료 진단 (사업장 전용 구글 설문 폼 반영 완료) -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfH2RASsftwSF0xGV0z0lhKL0iGF36bcHIwOLD3ZirNNvrksw/viewform" target="_blank" class="btn-item btn-business">
        <div class="left-group">
          <span>📋</span>
          <span>사업장 과태료 & 위험 1분 점검</span>
        </div>
        <span class="arrow">➔</span>
      </a>

      <!-- 4. 카카오톡 상담 -->
      <a href="https://open.kakao.com/o/svpmlrGi" target="_blank" class="btn-item btn-kakao">
        <div class="left-group">
          <span>💬</span>
          <span>카카오톡 1:1 비밀 상담</span>
        </div>
        <span class="arrow">➔</span>
      </a>

      <!-- 5. 네이버 공식 블로그 -->
      <a href="https://blog.naver.com/haumphoto" target="_blank" class="btn-item btn-blog">
        <div class="left-group">
          <span>📝</span>
          <span>네이버 공식 블로그 바로가기</span>
        </div>
        <span class="arrow">➔</span>
      </a>

      <!-- 6. 인스타그램 -->
      <a href="https://www.instagram.com/onescale001" target="_blank" class="btn-item btn-insta">
        <div class="left-group">
          <span>📸</span>
          <span>공식 인스타그램 구경하기</span>
        </div>
        <span class="arrow">➔</span>
      </a>
    </div>

    <div class="footer">
      © 한화손해보험 김의철 팀장. All Rights Reserved.
    </div>
  </div>

</body>
</html>
